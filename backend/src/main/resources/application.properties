spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fashionsense}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fashionsense}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

app.email-verification.expiration-minutes=1440

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Spring Cache
spring.cache.type=redis
spring.cache.cache-names=productDetails
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.group-id=fashionsense-order-events
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.fashionsense.order

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info

# Do not expose infrastructure details publicly.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Explicitly enable liveness and readiness probes.
management.endpoint.health.probes.enabled=true

# Application information exposed through the authenticated /actuator/info endpoint.
management.info.env.enabled=true
info.app.name=Fashion Sense Backend
info.app.description=Fashion Sense ecommerce backend
info.app.version=0.0.1-SNAPSHOT

# Optional product image uploads. Existing URL-based images remain supported.
app.images.s3.enabled=${S3_IMAGES_ENABLED:false}
app.images.s3.bucket=${S3_IMAGES_BUCKET:}
app.images.s3.region=${AWS_REGION:us-east-1}
app.images.s3.public-base-url=${S3_IMAGES_PUBLIC_BASE_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
