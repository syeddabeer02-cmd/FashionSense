name: Fashion Sense CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend:
    name: Backend - Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_DB: fashionsense
      POSTGRES_USER: fashionsense
      POSTGRES_PASSWORD: ci_fashionsense_password

      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fashionsense
      SPRING_DATASOURCE_USERNAME: fashionsense

      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"

      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      JWT_SECRET: ci-only-fashion-sense-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Start PostgreSQL, Redis and Kafka
        working-directory: infrastructure
        run: |
          docker compose up -d --wait postgres redis kafka
          docker compose ps

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Show infrastructure logs on failure
        if: failure()
        working-directory: infrastructure
        run: docker compose logs --no-color --tail=200

      - name: Stop infrastructure
        if: always()
        working-directory: infrastructure
        run: docker compose down -v


  frontend:
    name: Frontend - Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      BACKEND_API_BASE_URL: http://localhost:8080

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js production application
        run: npm run build